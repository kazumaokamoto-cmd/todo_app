<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TODOアプリ</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h1 class="mb-4">TODOアプリ</h1>

    <!-- ✅ 新規追加フォーム -->
    <div class="card p-3 mb-4">
        <h4>新規作成</h4>

        <form action="/add" method="POST">
            
            <div class="mb-2">
                <input 
                    type="text" 
                    name="new_title" 
                    placeholder="タイトル"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-2">
                <input 
                    type="text" 
                    name="new_category" 
                    placeholder="カテゴリ"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-2">
                <input 
                    type="date" 
                    name="new_deadline"
                    class="form-control"
                >
            </div>

            <button type="submit" class="btn btn-primary">
                追加
            </button>
        </form>
    </div>

    <!-- ✅ TODO一覧 -->
    <div class="card p-3">
        <h4>TODO一覧（クリックで完了）</h4>

        {% if todos %}
            {% for todo in todos %}
                <form action="/complete/{{ todo.id }}" method="POST" class="mb-2">
                    <button type="submit" class="btn btn-outline-success w-100 text-start">

                        <strong>{{ todo.title }}</strong>
                        （{{ todo.category }}）

                        {% if todo.deadline %}
                            <span class="text-muted"> - 期限: {{ todo.deadline }}</span>
                        {% endif %}

                    </button>
                </form>
            {% endfor %}
        {% else %}
            <p class="text-muted">TODOがありません</p>
        {% endif %}
    </div>

</body>
</html>
