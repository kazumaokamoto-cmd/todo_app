<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ToDo{% endblock %}</title>
  <!-- Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #fbfbfc;
    }
    .custom-shadow {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }
    /* Smooth transition for hover effects */
    .hover-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="font-sans antialiased text-gray-800">

  <div class="min-h-screen flex">
    <!-- 💻 左側サイドバー -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col justify-between p-6 shrink-0">
      <div>
        <!-- ブランド・ロゴ -->
        <div class="flex items-center gap-3 mb-8 px-2">
          <div class="bg-amber-400 text-gray-900 w-9 h-9 rounded-xl flex items-center justify-center font-extrabold text-xl shadow-md shadow-amber-200">
            ✓
          </div>
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">ToDo</h1>
            <p class="text-xs text-gray-400">Optimistic Productivity</p>
          </div>
        </div>

        <!-- ナビゲーションメニュー -->
        <nav class="space-y-1.5">
          <!-- TODO -->
          <a href="/" 
             class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold hover-transition {% if active_page == 'todo' %}bg-amber-400 text-gray-900 shadow-md shadow-amber-100{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
            Todo
          </a>

          <!-- ARCHIVE -->
          <a href="/archive" 
             class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold hover-transition {% if active_page == 'archive' %}bg-amber-400 text-gray-900 shadow-md shadow-amber-100{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Archive
          </a>

          <!-- WEEKLY -->
          <a href="/weekly" 
             class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold hover-transition {% if active_page == 'weekly' %}bg-amber-400 text-gray-900 shadow-md shadow-amber-100{% else %}text-gray-500 hover:bg-gray-50 hover:text-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            Weekly
          </a>
        </nav>
      </div>

      
    </aside>

    <!-- 📄 メインコンテンツエリア -->
    <main class="flex-1 p-10 overflow-y-auto max-w-7xl mx-auto w-full">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
